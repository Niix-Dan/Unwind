name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (ex: v1.0.0)'
        required: true
        type: string
      version:
        description: 'Mod version (ex: 1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release title (ex: Unwind 1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as Pre-release (Alpha/Beta)?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=${{ inputs.version }} -Pversion=${{ inputs.version }}

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar